<script>
  import Nav from "../components/Nav";
  import Card from "../components/ui/Card/Card";
  import CardHeader from "../components/ui/Card/CardHeader";
  import CardTitle from "../components/ui/Card/CardTitle";
  import CardDescription from "../components/ui/Card/CardDescription";
  import Badge from "../components/ui/Badge/Badge";
  import { posts } from "../utils/posts";
</script>

<Nav />

<main class="mx-auto max-w-3xl px-6 py-12">
  <h1 class="mb-1 font-heading text-3xl font-semibold text-foreground">Blog</h1>
  <p class="mb-6 max-w-xl text-muted-foreground">File-based routing: this list lives at <code class="rounded bg-muted px-1.5 py-0.5 text-sm">src/blog/page.html</code>, each post at the dynamic route <code class="rounded bg-muted px-1.5 py-0.5 text-sm">src/blog/[slug]/page.html</code>.</p>
  <p class="mb-10 max-w-xl text-sm text-muted-foreground">One dynamic segment isn't the whole story — <a to="/match/premier-league/1042" class="text-primary underline underline-offset-2">/match/[slug]/[id]</a> shows two segments in the same route.</p>

  <div class="space-y-3">
    <for each="post of posts" key="post.slug">
      <!--
        Empty overlay anchor, not a wrapping one -- the router's click
        listener reads e.target.getAttribute("to"), not e.currentTarget, so
        clicking any nested element (the badge, the title) makes e.target a
        node with no "to" attribute and the nav goes to literal "/null".
        Content-free + absolutely positioned means nothing inside it can
        ever be the click target.
      -->
      <Card class="relative transition-colors hover:ring-primary/40">
        <CardHeader>
          <Badge variant="outline" class="mb-1 w-fit">{post.date}</Badge>
          <CardTitle>{post.title}</CardTitle>
          <CardDescription>{post.excerpt}</CardDescription>
        </CardHeader>
        <a to="/blog/{post.slug}" class="absolute inset-0" aria-label="{post.title}"></a>
      </Card>
    </for>
  </div>
</main>
