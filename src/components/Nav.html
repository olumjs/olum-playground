<script>
  import Button from "./ui/Button/Button";
  import Anchor from "./ui/Anchor/Anchor";
  import Icon from "./ui/Icon/Icon";
  import Toaster from "./ui/Toast/Toaster";
  import { Sun, Moon, ArrowUpRight } from "olum-icons/lucide";
  import { OlumLogo } from "olum-icons";
  import { theme } from "../utils/theme";

  // Bare top-level function ref, passed braced ({toggleTheme}) below — component
  // props are JSON-serialized, so an inline arrow or a dotted method reference
  // (theme.toggle) would silently drop: the compiler only wires a prop live when
  // it's a plain identifier matching a function declared right here.
  const toggleTheme = () => theme.toggle();
</script>

<header class="sticky top-0 z-40 border-b border-border bg-background/80 backdrop-blur">
  <div class="mx-auto flex h-14 max-w-[1400px] items-center justify-between gap-4 px-6">
    <!--
      Empty overlay anchor, not a wrapping one -- the router's click listener
      reads e.target.getAttribute("to"), not e.currentTarget, so clicking the
      icon or the text makes e.target a node with no "to" attribute and the
      nav goes to literal "/null". Content-free + absolutely positioned means
      nothing inside it can ever be the click target.
    -->
    <div class="group relative flex shrink-0 items-center gap-2.5">
        <Icon icon="{OlumLogo}" class="w-4 relative top-0.5 text-[#25C97E]" />
      <span class="font-heading text-[15px] font-semibold tracking-tight text-foreground">
        Olum <span class="font-normal text-muted-foreground">Playground</span>
      </span>
      <a to="/" class="absolute inset-0" aria-label="Olum Playground — home"></a>
    </div>

    <nav class="hidden items-center gap-6 md:flex">
      <Anchor href="https://olumjs.top/docs" target="_blank" variant="link" class="h-auto p-0 text-sm font-normal text-muted-foreground hover:text-foreground">Docs</Anchor>
      <Anchor to="/" variant="link" class="h-auto p-0 text-sm font-normal text-muted-foreground hover:text-foreground">Playground</Anchor>
      <Anchor to="/ui" variant="link" class="h-auto p-0 text-sm font-normal text-muted-foreground hover:text-foreground">UI Kit</Anchor>
      <Anchor href="https://github.com/olumjs" target="_blank" variant="link" class="h-auto gap-1 p-0 text-sm font-normal text-muted-foreground hover:text-foreground">
        GitHub
        <Icon icon="{ArrowUpRight}" class="size-3.5" />
      </Anchor>
    </nav>

    <div class="flex items-center gap-2">
      <Button variant="ghost" size="icon" ariaLabel="Toggle theme" onclick="{toggleTheme}">
        <Icon icon="{theme.dark ? Sun : Moon}" class="size-4" />
      </Button>
      <Anchor to="/reactivity" class="border-transparent bg-brand text-brand-ink hover:bg-brand hover:brightness-110">Get Started</Anchor>
    </div>
  </div>
</header>

<Toaster position="bottom-right" />
