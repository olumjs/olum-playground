<script public-props public-methods>
  import { props } from "olum";

  const { value, onchange } = props();

  const bump = () => onchange(value + 1);
</script>

<div class="flex items-center gap-3 rounded-lg border border-border p-3">
  <span class="text-2xl font-semibold tabular-nums text-foreground">{value}</span>
  <button
    type="button"
    class="inline-flex h-8 items-center justify-center rounded-lg bg-primary px-3 text-sm font-medium text-primary-foreground hover:bg-primary/80"
    onclick="bump()"
  >
    +1
  </button>
</div>
