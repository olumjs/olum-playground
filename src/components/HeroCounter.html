<script>
  const state = { count: 0 };
  const inc = () => state.count++;
</script>

<div class="flex items-center gap-3 rounded-lg border border-white/10 bg-white/5 px-4 py-3">
  <span class="font-mono text-xs text-white/40">Count:</span>
  <span class="font-mono text-lg font-semibold tabular-nums text-white">{state.count}</span>
  <button
    onclick="inc()"
    class="ml-auto inline-flex h-8 items-center justify-center rounded-md bg-brand px-3 text-sm font-medium text-brand-ink transition-transform active:scale-95 hover:brightness-110"
  >+1</button>
</div>
